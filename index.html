<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>数字カード対戦</title>
</head>
<body>
<style>
/* Layout: 上に相手、中央に山札、下に自分。右（狭い画面では下）に記録。飾りなしの白黒基調。 */
:root{
  --bg:#f4f4f2; --surface:#ffffff; --line:#d9d9d6; --text:#1c1c1e; --muted:#6a6a70;
  --accent:#2557d6; --accent-ink:#ffffff; --danger:#cf3b2b; --ok:#1d8a5a;
  --card:#ffffff; --card-ink:#111111; --back:#3d4f7a;
  --f:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
  --cw:96px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151618; --surface:#202125; --line:#393a40; --text:#ececef; --muted:#9a9aa3;
  --accent:#7ea4ff; --accent-ink:#111111; --danger:#ff7b6b; --ok:#5fd09b;
  --card:#f7f7f5; --card-ink:#111111; --back:#4a5d8f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151618; --surface:#202125; --line:#393a40; --text:#ececef; --muted:#9a9aa3;
  --accent:#7ea4ff; --accent-ink:#111111; --danger:#ff7b6b; --ok:#5fd09b;
  --card:#f7f7f5; --card-ink:#111111; --back:#4a5d8f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:flex-end}
.hbtns{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
.btn{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.table{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@media (max-width:820px){.table{grid-template-columns:minmax(0,1fr)}}
.board{display:flex;flex-direction:column;gap:12px;min-width:0}
.seat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.seat.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.seat-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seat-name{font-weight:700;font-size:16px;margin-right:4px}
.chip{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid currentColor}
.chip.turn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chip.ward,.chip.glass{color:var(--muted)}
.chip.know{color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.label{font-size:12px;color:var(--muted)}
.discards{display:flex;flex-wrap:wrap;gap:5px;min-height:34px;align-items:center}
.discards .empty{color:var(--muted);font-size:13px}

.card{width:var(--cw);aspect-ratio:5/7;max-width:100%;border-radius:8px;flex:none;user-select:none}
.face{background:var(--card);color:var(--card-ink);border:2px solid var(--card-ink);display:flex;flex-direction:column;align-items:center;padding:8px}
.face .num{font-weight:800;font-size:calc(var(--cw)*.4);line-height:1.05}
.face .tx{font-size:calc(var(--cw)*.095);line-height:1.45;margin-top:6px;align-self:stretch}
.back{background:var(--back);border:2px solid var(--back)}
.mini{width:32px;height:32px;aspect-ratio:auto;border-radius:6px;padding:0;justify-content:center;border-width:1px}
.mini .num{font-size:17px}
.hand .card{--cw:124px}
.hand .card.playable{cursor:pointer}
.hand .card.playable:hover{transform:translateY(-4px)}
.hand .card.sel{transform:translateY(-8px);outline:3px solid var(--accent);outline-offset:2px}
.hand .card.locked{opacity:.55}
.newcard{animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

.center{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.pile{display:flex;flex-direction:column;align-items:center;gap:4px}
.pile .card{--cw:56px}
.pile .cap{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pile .gone{width:56px;aspect-ratio:5/7;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.meteor{display:flex;gap:5px}
.meteor span{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.meteor span.on{background:var(--text);color:var(--bg);border-color:var(--text)}

.actionbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-height:40px}
.prompt{font-weight:700;font-size:17px}
.detail{font-size:14px;color:var(--muted);max-width:62ch}
.detail b{color:var(--text)}

aside{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:700}
.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:5px;max-height:320px;overflow:auto}
.log li{border-left:3px solid var(--line);padding-left:8px}
.log li.me{border-color:var(--accent)}
.log li.cpu{border-color:var(--muted)}
.log li.sys{color:var(--muted)}
.log li.big{font-weight:700}

details.rules{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
details.rules summary{cursor:pointer;font-weight:700}
.rules-body{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rules-body p,.rules-body li{max-width:70ch;margin:0}
.rules-body ol{margin:0;padding-left:1.3em}
.cardlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.cardlist div{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:6px;font-size:13px}
.cardlist .r{font-weight:800;font-size:18px;width:28px;flex:none}

.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:540px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.mbox h3{margin:0;font-size:18px}
.mbox .mtext{margin:0}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.choices.cards button{background:none;border:0;padding:0;border-radius:8px}
.choices.cards .card{--cw:120px}
.choices.cards button:hover .card{outline:3px solid var(--accent);outline-offset:2px}
.choices .cap{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:4px}
.choices.opts .btn{min-width:52px}
.mfoot{display:flex;justify-content:flex-end;gap:8px}
.result{font-size:36px;font-weight:800;text-align:center}
.result.win{color:var(--ok)} .result.lose{color:var(--danger)} .result.draw{color:var(--muted)}

@media (max-width:520px){
  .hand .card{--cw:106px}
  .choices.cards .card{--cw:104px}
  .seat{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header><div class="hbtns"><button class="btn" id="rulesBtn" type="button">遊び方</button><button class="btn solid" id="newBtn" type="button">新しい対局</button></div></header>

  <div class="table">
    <div class="board">
      <section class="seat" id="seatCpu">
        <div class="seat-head"><span class="seat-name">CPU</span><span id="cpuChips"></span></div>
        <div class="row" id="cpuHand"></div>
        <div><div class="label">捨て札</div><div class="discards" id="cpuDiscard"></div></div>
      </section>

      <div class="center">
        <div class="pile"><div id="deckCard"></div><span class="cap" id="deckCap">山札</span></div>
        <div class="pile"><div id="rebornCard"></div><span class="cap">転生札</span></div>
        <div class="pile"><div class="meteor" id="meteor"></div><span class="cap">出た1の数</span></div>
      </div>

      <section class="seat" id="seatMe">
        <div class="seat-head"><span class="seat-name">あなた</span><span id="meChips"></span></div>
        <div class="row hand" id="meHand"></div>
        <div class="actionbar"><span class="prompt" id="prompt"></span><button class="btn solid" id="playBtn" type="button" hidden>このカードを出す</button></div>
        <div class="detail" id="detail"></div>
        <div><div class="label">捨て札</div><div class="discards" id="meDiscard"></div></div>
      </section>
    </div>

    <aside>
      <div class="panel">
        <h2>記録</h2>
        <ul class="log" id="log"></ul>
      </div>
    </aside>
  </div>

  <details class="rules" id="rules">
    <summary>遊び方</summary>
    <div class="rules-body">
      <p>山札18枚。1枚を伏せて<b>転生札</b>にし、互いに1枚ずつ配って始めます。</p>
      <ol>
        <li>自分の番に山札から1枚引き、手札2枚のうち1枚を出して効果を使います。</li>
        <li>相手を倒すか、山札が尽きた時点で手札の数字が大きい方が勝ちです。</li>
        <li><b>10</b>は出せません。相手の効果で捨てさせられたら、残りの手札も捨てて転生札を手にし復活します（9で捨てさせられた場合と、転生札がもう無い場合は負け）。</li>
      </ol>
      <div class="cardlist" id="cardlist"></div>
    </div>
  </details>
</div>

<div class="modal" id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <p class="mtext" id="mText"></p>
    <div class="choices" id="mChoices"></div>
    <div class="mfoot" id="mFoot"></div>
  </div>
</div>

<script>
const CARDS={
  1:{count:2,text:'1枚目は効果なし。2枚目：相手に1枚引かせ、2枚を見て1枚捨てさせる'},
  2:{count:2,text:'相手の手札の数字を当てたら勝ち'},
  3:{count:2,text:'相手の手札を見る'},
  4:{count:2,text:'次の自分の番まで相手の効果を受けない'},
  5:{count:2,text:'相手に1枚引かせ、伏せたまま1枚捨てさせる'},
  6:{count:2,text:'手札を比べ、小さい方が負け（同じなら何もなし）'},
  7:{count:2,text:'次の番、山札3枚から1枚を選んで引く'},
  8:{count:2,text:'相手と手札を交換する'},
  9:{count:1,text:'相手に1枚引かせ、2枚を見て1枚捨てさせる。10を捨てさせたら転生不可'},
  10:{count:1,text:'出せない。効果で捨てさせられたら転生札で復活'}
};
const TARGETED=new Set([1,2,3,5,6,8,9]);
const $=s=>document.querySelector(s);
const cname=n=>`「${n}」`;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const pace=ms=>new Promise(r=>setTimeout(r,reduceMotion?ms*.4:ms));

function cardHTML(c,cls=''){return `<div class="card face ${cls}" data-n="${c.n}"><span class="num">${c.n}</span><span class="tx">${CARDS[c.n].text}</span></div>`}
function backHTML(cls=''){return `<div class="card back ${cls}" aria-label="伏せ札"></div>`}
function miniHTML(c){return `<div class="card face mini" data-n="${c.n}" title="${CARDS[c.n].text}"><span class="num">${c.n}</span></div>`}

let G=null, firstPlayer=0, selIdx=null, playResolver=null;

function newGame(){
  closeModal();
  const deck=[];let id=0;
  for(const n in CARDS)for(let i=0;i<CARDS[n].count;i++)deck.push({n:+n,id:id++});
  shuffle(deck);
  G={deck,reborn:deck.pop(),meteor:0,over:false,winner:null,turn:firstPlayer,
     players:[{name:'あなた',hand:[],discard:[],protected:false,hourglass:false},
              {name:'CPU',hand:[],discard:[],protected:false,hourglass:false}],
     knows:[null,null],log:[],fresh:null};
  G.players[0].hand.push(deck.pop());G.players[1].hand.push(deck.pop());
  firstPlayer=1-firstPlayer;
  selIdx=null;playResolver=null;
  log(`対局開始。${G.turn===0?'あなた':'CPU'}が先手です。`,'sys');
  render();loop(G);
}

function log(msg,who='sys'){G.log.unshift({msg,who});renderLog()}

/* ---------- game loop ---------- */
async function loop(g){
  while(!g.over){
    const i=g.turn,P=g.players[i],oi=1-i;
    P.protected=false;
    if(g.deck.length===0){showdown();break}
    if(P.hourglass){
      P.hourglass=false;
      const pulled=g.deck.splice(-3);
      let k;
      if(i===0){render();k=await ask({title:'「7」の効果',text:`山札から${pulled.length}枚。手札に残す1枚を選んでください。残りは山札に戻ります。`,cards:pulled})}
      else k=cpuKeep(pulled);
      if(g!==G)return;
      const kept=pulled.splice(k,1)[0];
      P.hand.push(kept);g.deck.push(...pulled);shuffle(g.deck);g.fresh=kept.id;
      log(`${P.name}は${pulled.length+1}枚から1枚を選んだ`,i?'cpu':'me');
    }else{const c=g.deck.pop();P.hand.push(c);g.fresh=c.id}
    render();
    let idx;
    if(i===0)idx=await waitPlay();
    else{await pace(1000);idx=cpuChoose()}
    if(g!==G)return;
    const card=P.hand.splice(idx,1)[0];P.discard.push(card);
    if(g.knows[oi]!==null&&card.n===g.knows[oi])g.knows[oi]=null;
    log(`${P.name}は${cname(card.n)}を出した`,i?'cpu':'me');
    render();
    await applyEffect(i,card,g);
    if(g!==G)return;
    render();
    if(g.over)break;
    g.turn=oi;
    await pace(i===0?400:250);
    render();
  }
}

function waitPlay(){
  selIdx=null;
  return new Promise(res=>{playResolver=res;render()});
}

/* ---------- effects ---------- */
async function applyEffect(a,card,g){
  const A=g.players[a],oi=1-a,O=g.players[oi],n=card.n,tag=a?'cpu':'me';
  if(n===1){g.meteor++;if(g.meteor<2){log('1枚目の「1」。効果なし','sys');return}}
  if(n===4){A.protected=true;log(`${A.name}は次の番まで守られる`,tag);return}
  if(n===7){A.hourglass=true;log(`${A.name}の次の番は3枚から選べる`,tag);return}
  if(TARGETED.has(n)&&O.protected){log(`${O.name}は守られていて効果なし`,'sys');await pace(500);return}
  switch(n){
    case 1:log('2枚目の「1」！','big');await forcedDiscard(a,true,false,'「1」の効果');break;
    case 2:{
      let guess;
      if(a===0)guess=await ask({title:'「2」の効果',text:'相手の手札の数字を宣言してください。',options:Object.keys(CARDS).map(k=>({label:k,value:+k}))});
      else{await pace(500);guess=cpuGuess()}
      if(g!==G)return;
      log(`${A.name}は${cname(guess)}と宣言`,tag);
      if(O.hand[0]&&O.hand[0].n===guess){await pace(400);return end(a,`「2」で${O.name==='あなた'?'あなたの':'相手の'}手札（${cname(guess)}）を言い当てた`)}
      log('外れ','sys');
      if(a===1)g.cpuMiss=guess;
      break}
    case 3:
      g.knows[a]=O.hand[0]?O.hand[0].n:null;
      if(a===0){await ask({title:'「3」の効果',text:'相手の手札はこれです。',show:[{c:O.hand[0],cap:'相手の手札'}],ok:'閉じる'})}
      else log('CPUはあなたの手札を見た','cpu');
      break;
    case 5:await forcedDiscard(a,false,false,'「5」の効果');break;
    case 6:{
      const mine=A.hand[0],theirs=O.hand[0];
      if(!mine||!theirs)break;
      const me=a===0?mine:theirs,cpu=a===0?theirs:mine;
      g.knows[0]=cpu.n;g.knows[1]=me.n;
      await ask({title:'「6」の効果',text:'互いの手札を見せ合います。',show:[{c:me,cap:'あなた'},{c:cpu,cap:'CPU'}],ok:'結果を見る'});
      if(g!==G)return;
      if(me.n===cpu.n){log('同じ数字。何も起きない','sys');break}
      return end(me.n>cpu.n?0:1,`「6」の比べ合いで${cname(Math.max(me.n,cpu.n))}が${cname(Math.min(me.n,cpu.n))}に勝った`)}
    case 8:{
      [A.hand,O.hand]=[O.hand,A.hand];
      g.knows[a]=O.hand[0]?O.hand[0].n:null;g.knows[oi]=A.hand[0]?A.hand[0].n:null;
      g.fresh=(a===0?A.hand[0]:O.hand[0])?.id;
      log('手札を交換した',tag);break}
    case 9:await forcedDiscard(a,true,true,'「9」の効果');break;
  }
}

async function forcedDiscard(a,open,noRevive,title){
  const g=G,A=g.players[a],oi=1-a,O=g.players[oi];
  if(g.deck.length){O.hand.push(g.deck.pop())}
  render();
  let idx;
  if(a===0){
    idx=await ask({title,text:open?'相手の手札です。捨てさせるカードを選んでください。':'伏せたままの2枚から、捨てさせるカードを選んでください。',cards:O.hand,faceDown:!open});
  }else{
    await pace(900);
    idx=open?cpuPickDiscard(O.hand):(Math.random()*O.hand.length|0);
  }
  if(g!==G)return;
  const c=O.hand.splice(idx,1)[0];O.discard.push(c);
  log(`${O.name}は${cname(c.n)}を捨てさせられた`,'big');
  g.knows[a]=open&&O.hand[0]?O.hand[0].n:null;
  if(g.knows[oi]!==null&&!A.hand.some(h=>h.n===g.knows[oi]))g.knows[oi]=null;
  render();
  if(c.n===10){await pace(500);sunFalls(oi,noRevive);return}
  if(!O.hand.length)end(a,`${O.name==='あなた'?'あなたの':'相手の'}手札が尽きた`);
}

function sunFalls(i,noRevive){
  const g=G,P=g.players[i];
  if(noRevive){end(1-i,'「9」で「10」を捨てさせた（転生不可）');return}
  if(!g.reborn){end(1-i,'「10」が捨てられ、転生札はもう無い');return}
  while(P.hand.length)P.discard.push(P.hand.pop());
  P.hand.push(g.reborn);g.reborn=null;g.knows[1-i]=null;
  if(i===0)g.fresh=P.hand[0].id;
  log(`「10」が捨てられ、${P.name}は転生札で復活した`,'big');
  render();
}

function showdown(){
  const a=G.players[0].hand[0],b=G.players[1].hand[0];
  log(`山札が尽きた。手札比べ：あなた ${cname(a.n)} / CPU ${cname(b.n)}`,'big');
  if(a.n===b.n)end(-1,'山札が尽き、手札の数字が同じだった');
  else end(a.n>b.n?0:1,`山札が尽き、手札の大きさで決着（${cname(Math.max(a.n,b.n))}）`);
}

function end(winner,reason){
  G.over=true;G.winner=winner;playResolver=null;
  log(winner===-1?'引き分け':`${winner===0?'あなた':'CPU'}の勝ち：${reason}`,'big');
  render();
  const g=G;
  pace(500).then(()=>{if(g!==G)return;
    const cls=winner===0?'win':winner===1?'lose':'draw';
    const word=winner===0?'勝利':winner===1?'敗北':'引分';
    ask({title:'対局終了',html:`<div class="result ${cls}">${word}</div><p style="text-align:center;margin:0">${reason}</p>`,ok:'もう一局',alt:'盤面を見る'}).then(v=>{if(v===true)newGame()});
  });
}

/* ---------- CPU ---------- */
function unseen(viewer){
  const cnt={};for(const n in CARDS)cnt[n]=CARDS[n].count;
  for(const p of G.players)for(const c of p.discard)cnt[c.n]--;
  for(const c of G.players[viewer].hand)cnt[c.n]--;
  return cnt;
}
function cpuGuess(){
  if(G.knows[1]!==null)return G.knows[1];
  const cnt=unseen(1);let best=2,bv=-1;
  for(const n in cnt){const v=cnt[n]+(+n/100)-(G.cpuMiss==n?5:0);if(v>bv){bv=v;best=+n}}
  return best;
}
function cpuChoose(){
  const H=G.players[1].hand,known=G.knows[1],guard=G.players[0].protected;
  let best=0,bs=-1e9;
  H.forEach((c,i)=>{
    if(c.n===10)return;
    const keep=H[1-i],k=keep.n;let s=k*1.2+Math.random()*1.5;
    const t=guard&&TARGETED.has(c.n);
    switch(c.n){
      case 1:s+=(G.meteor===1&&!t)?14:3;break;
      case 2:s+=t?0:(known!==null?100:3);break;
      case 3:s+=t?0:(known===null?5:1);break;
      case 4:s+=4;break;
      case 5:s+=t?0:6;break;
      case 6:if(t)break;if(known!==null)s+=k>known?90:k<known?-60:0;else s+=k>=7?5:-12;break;
      case 7:s+=3;break;
      case 8:if(t)break;if(k===10)s-=100;else if(known!==null)s+=known>k?10:-6;else s-=2;break;
      case 9:s+=t?2:18;break;
    }
    if(s>bs){bs=s;best=i}
  });
  return best;
}
function cpuPickDiscard(hand){let bi=0;hand.forEach((c,i)=>{if(c.n>hand[bi].n)bi=i});return bi}
function cpuKeep(cards){const w=c=>c.n+(c.n===9?4:0)+(c.n===2&&G.knows[1]!==null?20:0);let bi=0;cards.forEach((c,i)=>{if(w(c)>w(cards[bi]))bi=i});return bi}

/* ---------- modal ---------- */
let modalResolve=null;
function closeModal(){$('#modal').hidden=true;modalResolve=null}
function ask({title,text='',html='',cards,faceDown,show,options,ok,alt}){
  return new Promise(res=>{
    modalResolve=res;
    $('#mTitle').textContent=title;
    const mt=$('#mText');if(html){mt.innerHTML=html}else{mt.textContent=text}
    const box=$('#mChoices'),foot=$('#mFoot');box.innerHTML='';foot.innerHTML='';box.className='choices';
    const done=v=>{$('#modal').hidden=true;modalResolve=null;res(v)};
    if(cards){box.classList.add('cards');cards.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=faceDown?backHTML():cardHTML(c);b.setAttribute('aria-label',faceDown?`${i+1}枚目`:cname(c.n));b.onclick=()=>done(i);box.append(b)})}
    if(show){box.classList.add('cards');show.forEach(s=>{const d=document.createElement('div');d.innerHTML=cardHTML(s.c)+`<span class="cap">${s.cap}</span>`;box.append(d)})}
    if(options){box.classList.add('opts');options.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=o.label;b.style.fontFamily='var(--f-num)';b.style.fontSize='20px';b.onclick=()=>done(o.value);box.append(b)})}
    if(alt){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=alt;b.onclick=()=>done(false);foot.append(b)}
    if(ok){const b=document.createElement('button');b.type='button';b.className='btn solid';b.textContent=ok;b.onclick=()=>done(true);foot.append(b)}
    $('#modal').hidden=false;
    const f=$('#modal button');if(f)f.focus();
  });
}

/* ---------- render ---------- */
function chips(p,i){
  let h='';
  if(!G.over&&G.turn===i)h+='<span class="chip turn">手番</span> ';
  if(p.protected)h+='<span class="chip ward">守り中</span> ';
  if(p.hourglass)h+='<span class="chip glass">次は3枚から</span> ';
  if(i===1&&G.knows[0]!==null&&!G.over)h+=`<span class="chip know">判明：${cname(G.knows[0])}</span> `;
  if(i===0&&G.knows[1]!==null&&!G.over)h+=`<span class="chip know">CPUに知られている</span> `;
  return h;
}
function render(){
  if(!G)return;
  const [me,cpu]=G.players;
  $('#seatMe').classList.toggle('active',!G.over&&G.turn===0);
  $('#seatCpu').classList.toggle('active',!G.over&&G.turn===1);
  $('#meChips').innerHTML=chips(me,0);$('#cpuChips').innerHTML=chips(cpu,1);
  $('#cpuHand').innerHTML=cpu.hand.map(c=>G.over?cardHTML(c):backHTML()).join('')||'<span class="detail">手札なし</span>';
  for(const [el,p] of [[$('#meDiscard'),me],[$('#cpuDiscard'),cpu]])
    el.innerHTML=p.discard.map(miniHTML).join('')||'<span class="empty">まだありません</span>';

  const hand=$('#meHand');hand.innerHTML='';
  const choosing=!!playResolver;
  me.hand.forEach((c,i)=>{
    const w=document.createElement('div');
    w.innerHTML=cardHTML(c,c.id===G.fresh?'newcard':'');
    const el=w.firstChild;
    const canPlay=choosing&&c.n!==10;
    if(choosing){el.classList.add(canPlay?'playable':'locked')}
    if(choosing&&selIdx===i)el.classList.add('sel');
    el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',cname(c.n));
    el.onclick=()=>{selIdx=i;render()};
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selIdx=i;render()}};
    hand.append(el);
  });
  G.fresh=null;
  if(!choosing&&selIdx!==null&&!me.hand[selIdx])selIdx=null;
  const sel=selIdx!==null?me.hand[selIdx]:null;
  const pb=$('#playBtn');
  pb.hidden=!choosing;
  pb.disabled=!sel||sel.n===10;
  let prompt='';
  if(G.over)prompt=G.winner===0?'あなたの勝ち':G.winner===1?'CPUの勝ち':'引き分け';
  else if(choosing)prompt=sel?(sel.n===10?'「10」は出せません':`${cname(sel.n)}を出しますか？`):'出すカードを選んでください';
  else if(G.turn===1)prompt='CPUが考えています…';
  $('#prompt').textContent=prompt;
  const show=sel||(me.hand.length===1?me.hand[0]:null);
  $('#detail').innerHTML=show?`<b>${cname(show.n)}</b>：${CARDS[show.n].text}`:'カードを選ぶと効果が表示されます。';

  $('#deckCard').innerHTML=G.deck.length?backHTML():'<div class="gone">空</div>';
  $('#deckCap').textContent=`山札 ${G.deck.length}`;
  $('#rebornCard').innerHTML=G.reborn?(G.over?cardHTML(G.reborn):backHTML()):'<div class="gone">使用済み</div>';
  $('#meteor').innerHTML=[1,2].map(k=>`<span class="${G.meteor>=k?'on':''}">${k}</span>`).join('');

  renderLog();
}
function renderLog(){$('#log').innerHTML=G.log.slice(0,60).map(l=>`<li class="${l.who}">${l.msg}</li>`).join('')}

$('#playBtn').onclick=()=>{
  if(!playResolver||selIdx===null)return;
  const c=G.players[0].hand[selIdx];if(!c||c.n===10)return;
  const r=playResolver;playResolver=null;const i=selIdx;selIdx=null;r(i);
};
$('#newBtn').onclick=newGame;
$('#rulesBtn').onclick=()=>{const d=$('#rules');d.open=true;d.scrollIntoView({behavior:reduceMotion?'auto':'smooth'})};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&G&&G.over)closeModal()});
$('#cardlist').innerHTML=Object.keys(CARDS).map(n=>`<div><span class="r">${n}</span><span>（${CARDS[n].count}枚）<br>${CARDS[n].text}</span></div>`).join('');

newGame();
</script>
